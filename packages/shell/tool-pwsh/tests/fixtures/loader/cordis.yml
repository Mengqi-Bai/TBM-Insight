# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@tbm-insight/system-prompt'

- id: fs
  name: '@tbm-insight/fs-local'

- id: session-projections
  name: '@tbm-insight/session-projection'

- id: working-directory
  name: '@tbm-insight/working-directory'

- id: tools
  name: '@tbm-insight/tools'

- id: tool-executor-native
  name: '@tbm-insight/tool-executor-native'

- id: subprocess
  name: '@tbm-insight/subprocess-local'

- id: bash
  name: '@tbm-insight/pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@tbm-insight/shell-env'

- id: tasks
  name: '@tbm-insight/jobs-local'

- id: tool-jobs
  name: '@tbm-insight/tool-jobs'

- id: tool-pwsh
  name: '@tbm-insight/tool-pwsh'
