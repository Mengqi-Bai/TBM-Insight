# Minimal live counterpart for the pwsh-tool-turn snapshot composition.
- id: llm-deepseek
  name: '@tbm-insight/llm-deepseek-api-key'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@tbm-insight/subprocess-local'

- id: bash-sandbox
  name: '@tbm-insight/bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@tbm-insight/pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@tbm-insight/shell-env'

- id: agent-default-model
  name: '@tbm-insight/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@tbm-insight/session-persistence-jsonl'
  config:
    root: !!js tbmHomePath('sessions')
    compression: !!js 'process.env.TBM_ENGINE_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@tbm-insight/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@tbm-insight/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: goal
  name: '@tbm-insight/goal'
  disabled: true

- id: goal-round-driver
  name: '@tbm-insight/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@tbm-insight/command-goal'
  disabled: true

- id: tool-goal
  name: '@tbm-insight/tool-goal'
  disabled: true

- id: skill
  name: '@tbm-insight/skill'
  disabled: true

- id: skill-filesystem
  name: '@tbm-insight/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@tbm-insight/tool-skill'
  disabled: true

- id: tool-bash
  name: '@tbm-insight/tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@tbm-insight/tool-pwsh'
  disabled: false
