# Keyless replay for padded persistent PowerShell completion frames.
- id: llm-deepseek
  name: '@tbm-insight/llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@tbm-insight/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- insert:
    - id: terminal
      name: '@tbm-insight/terminal'

- id: sandbox-policy
  name: '@tbm-insight/sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@tbm-insight/subprocess-local'

- insert:
    - id: padded-pwsh-backend
      name: './pwsh-snapshot-backend.mjs'

- id: agent-default-model
  name: '@tbm-insight/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@tbm-insight/session-persistence-jsonl'
  config:
    root: !!js tbmHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@tbm-insight/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@tbm-insight/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@tbm-insight/tool-jobs'
  disabled: true

- id: goal
  name: '@tbm-insight/goal'
  disabled: true

- id: goal-round-driver
  name: '@tbm-insight/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@tbm-insight/command-goal'
  disabled: true

- id: tool-goal
  name: '@tbm-insight/tool-goal'
  disabled: true

- id: skill
  name: '@tbm-insight/skill'
  disabled: true

- id: skill-filesystem
  name: '@tbm-insight/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@tbm-insight/tool-skill'
  disabled: true

- id: tool-bash
  name: '@tbm-insight/tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@tbm-insight/tool-pwsh-persistent'
