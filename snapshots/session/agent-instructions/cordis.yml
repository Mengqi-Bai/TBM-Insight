# Workspace-context snapshot patch: the harness exports TBM_ENGINE_HOME=<cwd>/.tbm and
# TBM_ENGINE_AGENTS_HOME=<cwd>/.agents, so project-root and both user-global root
# discoveries stay inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@tbm-insight/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@tbm-insight/session-persistence-jsonl'
  config:
    root: !!js tbmHomePath('sessions')
    compression: !!js 'process.env.TBM_ENGINE_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@tbm-insight/agent-instructions'
  config:
    maxBytes: 65536
    projectRootMarkers:
      - .tbm-project

- id: system-prompt
  name: '@tbm-insight/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
