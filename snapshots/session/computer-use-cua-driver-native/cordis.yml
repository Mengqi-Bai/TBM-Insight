- id: agent-default-model
  name: '@tbm-insight/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@tbm-insight/session-persistence-jsonl'
  config:
    root: !!js tbmHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@tbm-insight/agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@tbm-insight/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: attachment-local
  name: '@tbm-insight/attachment-local'

- insert:
    - id: computer-use
      name: '@tbm-insight/computer-use'
    - id: native-computer-use-fixture
      name: './native-fixture.mjs'
