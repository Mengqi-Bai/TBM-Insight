[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "tbm-insight-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled tbm CLI runtime for the TBM Insight Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]

[project.urls]
Homepage = "https://github.com/deepseek-ai/deepseek-harness"
Documentation = "https://github.com/deepseek-ai/deepseek-harness/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/deepseek-ai/deepseek-harness/issues"
Source = "https://github.com/deepseek-ai/deepseek-harness"

[project.scripts]
tbm = "tbm_insight_runtime:main"

# Include the injected tbm executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = [
  "src/tbm_insight_runtime/runtime/tbm-insight-sdk-runtime-*",
  "src/tbm_insight_runtime/runtime/tbm-insight-sdk-runtime-*/**",
  "src/tbm_insight_runtime/runtime/linux-*/**",
  "src/tbm_insight_runtime/runtime/macos-*/**",
  "src/tbm_insight_runtime/runtime/win-*/**",
]
exclude = ["src/tbm_insight_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/tbm_insight_runtime"]
# The release job uses Twine 6.2.0, which accepts core metadata through 2.4.
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
